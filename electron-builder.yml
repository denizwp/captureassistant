appId: com.captureassistant.app
productName: Capture Assistant
copyright: © 2026 denizwp

extraMetadata:
  description: Capture Assistant

directories:
  output: release
  buildResources: build

files:
  - out/**
  - package.json
  - '!**/*.map'

extraResources:
  - from: resources
    to: .
    filter:
      - '**/*'

asar: true
asarUnpack:
  - '**/*.node'
  - '**/node_modules/uiohook-napi/**'
  - 'out/main/supervisor.js'

win:
  target:
    - target: portable
      arch: [x64]
  icon: build/icon.ico

portable:
  artifactName: CaptureAssistant.exe
  unpackDirName: CaptureAssistant
  requestExecutionLevel: user

publish:
  provider: github
  owner: denizwp
  repo: captureassistant
  releaseType: release
