appId: com.captureassistant.app
productName: Capture Assistant
copyright: © 2026 denizwp

extraMetadata:
  description: Capture Assistant

directories:
  output: release
  buildResources: build

files:
  - out/**
  - package.json
  - '!**/*.map'

extraResources:
  - from: resources
    to: .
    filter:
      # ffprobe is another 139MB of the same binary and nothing needs it: ffmpeg
      # asked for no output prints the header the same way.
      - '**/*'
      - '!ffmpeg/ffprobe.exe'

# Chromium ships 55 locales at 42MB; the portable launcher unpacks all of them
# on every start.
electronLanguages:
  - en-US
  - tr

asar: true
asarUnpack:
  - '**/*.node'
  - '**/node_modules/uiohook-napi/**'
  - 'out/main/supervisor.js'

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico

# The portable target unpacks itself into %TEMP% and verifies the archive on
# every launch, which measured 8 seconds before the app even started. What is
# downloaded is still a single exe; it just installs once and then starts in a
# fraction of a second.
nsis:
  artifactName: CaptureAssistant.exe
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Capture Assistant
  deleteAppDataOnUninstall: false

publish:
  provider: github
  owner: denizwp
  repo: captureassistant
  releaseType: release
