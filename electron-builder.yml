appId: com.captureassistant.app
productName: Capture Assistant
copyright: Capture Assistant

directories:
  output: release
  buildResources: build

files:
  - out/**
  - package.json
  - '!**/*.map'

# ffmpeg.exe and ffprobe.exe live here, plus the icons the tray and windows
# load at runtime. Copied next to the app rather than into the asar so ffmpeg
# can be spawned as a normal executable.
extraResources:
  - from: resources
    to: .
    filter:
      - '**/*'

asar: true
# Native addons cannot be loaded from inside an asar archive.
asarUnpack:
  - '**/*.node'
  - '**/node_modules/uiohook-napi/**'
  # utilityProcess.fork cannot load its entry from inside the archive.
  - 'out/main/supervisor.js'

# Portable rather than an installer: nothing here needs the registry or Program
# Files, and a self-extracting exe would unpack ~280MB of ffmpeg to temp on
# every launch. The zip itself is built by scripts/pack-zip.mjs — see the note
# there for why electron-builder's own zip target cannot run on this machine.
win:
  target:
    - target: dir
      arch: [x64]
  icon: build/icon.ico

publish:
  provider: github
  owner: denizwp
  repo: captureassistant
  releaseType: release
