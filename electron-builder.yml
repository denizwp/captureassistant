appId: com.captureassistant.app
productName: Capture Assistant
copyright: © 2026 denizwp

extraMetadata:
  description: Capture Assistant

directories:
  output: release
  buildResources: build

files:
  - out/**
  - package.json
  - '!**/*.map'

extraResources:
  - from: resources
    to: .
    filter:
      # ffprobe is another 139MB of the same binary and nothing needs it: ffmpeg
      # asked for no output prints the header the same way.
      - '**/*'
      - '!ffmpeg/ffprobe.exe'

# Chromium ships 55 locales at 42MB; the portable launcher unpacks all of them
# on every start.
electronLanguages:
  - en-US
  - tr

asar: true
asarUnpack:
  - '**/*.node'
  - '**/node_modules/uiohook-napi/**'
  - 'out/main/supervisor.js'

win:
  target:
    - target: portable
      arch: [x64]
  icon: build/icon.ico

portable:
  artifactName: CaptureAssistant.exe
  unpackDirName: CaptureAssistant
  requestExecutionLevel: user

publish:
  provider: github
  owner: denizwp
  repo: captureassistant
  releaseType: release
